name: Publication regression and documents
on:
  pull_request:
    paths:
      - 'manuscript/**'
      - 'src/graphpathology/*publication*'
      - 'src/graphpathology/extension*.py'
      - 'src/graphpathology/editorial.py'
      - 'experiments/editorial/**'
      - 'experiments/journal_revision/transformer_egnn/**'
      - 'configs/journal_revision/transformer_egnn/**'
      - 'docs/REPRODUCTION_TARGETS.csv'
      - 'configs/validation-environment.txt'
      - '.github/workflows/publication.yml'
  workflow_dispatch:
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLCONFIGDIR: /tmp/graphpathology-publication
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document tools
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - run: python -m pip install -r configs/validation-environment.txt
      - run: python -m pip install -e '.[test]'
      - name: Verify committed extension evidence before document builds
        run: python -m graphpathology.extension verify --committed-only
      - name: Verify editorial scientific-source preservation
        run: python -m graphpathology.editorial check --committed-only --output outputs/editorial-integrity.json
      - run: python -m graphpathology publication --output outputs/publication
      - run: python -m graphpathology build-documents --publication outputs/publication --output outputs/paper
      - run: python -m graphpathology arxiv --output outputs/arxiv
      - name: Build separate journal revision from committed exports (no training or research downloads)
        run: python -m graphpathology.journal paper --build-output outputs/journal
      - name: Build bounded Transformer and EGNN manuscript from committed sources
        run: python -m graphpathology.extension paper --build-output outputs/journal-extension
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-validation
          path: |
            outputs/publication/REGRESSION.json
            outputs/publication/TARGET_STATUS.json
            outputs/paper/BUILD_REPORT.json
            outputs/paper/*.pdf
            outputs/arxiv/ARXIV_REPORT.json
            outputs/arxiv/*.zip
            outputs/journal/*.pdf
            outputs/journal-extension/*.pdf
            outputs/journal-extension/EXTENSION_BUILD_REPORT.json
            outputs/extension-validation-committed.json
            outputs/editorial-integrity.json
            manuscript/journal_revision/JOURNAL_BUILD_REPORT.json
