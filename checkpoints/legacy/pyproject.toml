[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphpathology"
version = "0.1.0"
description = "Checkpointed spatial transcriptome reconstruction research"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "h5py", "Pillow", "matplotlib", "requests", "scikit-learn"]

[project.optional-dependencies]
vision = ["torch", "torchvision"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
